<div id="outfit" class="tabcontent hide"><div class="section"><h3>Wardrobe</h3><label>ชุด</label><select id="outfitStyle" class="select"><option value="casual">Casual</option><option value="uniform">Academy</option><option value="dress">Dress</option><option value="sport">Sport</option><option value="coat">Coat</option></select><div class="row"><label>สีชุดหลัก</label></div><div class="colorrow" id="clothColors"></div><label>รองเท้า</label><select id="shoeStyle" class="select"><option value="boots">Boots</option><option value="sneakers">Sneakers</option><option value="heels">Heels</option></select><label>เครื่องประดับ</label><select id="accessory" class="select"><option value="none">ไม่มี</option><option value="necklace">สร้อยคอ</option><option value="glasses">แว่น</option><option value="earrings">ต่างหู</option><option value="bow">โบว์ผม</option></select></div></div>

<div class="notice">Shojo-inspired 3D: ดวงตาประกาย เส้นขอบบาง โทนพาสเทล และฉากระยิบระยับ • โมเดล Geometry ปรับแต่งสดได้</div></div><div class="footer"><button id="exportBtn">Export JSON</button><button id="importBtn">Import JSON</button><input type="file" id="fileInput" accept=".json" hidden></div></aside></main>

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabcontent').forEach(x=>x.classList.add('hide'));$(b.dataset.tab).classList.remove('hide');});
function colorButtons(id,key,values){values.forEach(v=>{const b=document.createElement('button');b.style.background=v;b.title=v;b.setAttribute('aria-label',v);b.onclick=()=>{actors[active].data[key]=v;rebuildActive();};$(id).appendChild(b);});}colorButtons('skinColors','skin',['#f4c9b5','#ffe0c6','#d8a47f','#9b654c','#6d493b','#f3d9a7']);colorButtons('eyeColors','eye',['#7b85db','#42b9a9','#805a45','#e4a25a','#343d75','#e06b93']);colorButtons('hairColors','hair',['#342746','#f1d28a','#8b4e35','#242b3c','#e878a9','#e8e8ee','#71a4cf','#7652a2']);colorButtons('clothColors','cloth',palette);
const poses=[['ยืน','stand'],['นั่ง','sit'],['เดิน','walk'],['โบกมือ','wave'],['กอด','hug'],['โรแมนติก','romantic']];poses.forEach(([label,p])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{actors[active].data.pose=p;applyPreset(p);};$('poseButtons').appendChild(b);});['ยิ้ม','เขิน','ดีใจ','ตกใจ'].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{actors[active].data.emotion=['smile','shy','happy','surprised'][i];rebuildActive();};$('emotionButtons').appendChild(b);});[['จับมือ','hand'],['กอดกัน','hug'],['จูบแบบโรแมนติก','kiss'],['คุย','talk'],['ยืนใกล้','close']].forEach(([label,id])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(actors.length<2)addActor('male');if(!actors[1])return;duo=true;interaction=id;distance.value=(id==='close'||id==='hug'||id==='kiss'||id==='hand')?.75:1.35;actors.forEach((a,i)=>{a.data.pose=id;a.data.arm=id==='hand'?.55:id==='hug'?-.65:id==='talk'?.25:0;a.data.knee=0;a.rebuild();});arrange();};$('interactionButtons').appendChild(b);});
function applyPreset(p){const d=actors[active].data;d.arm=p==='wave'?1:p==='hug'?.8:p==='romantic'?.5:0;d.knee=p==='sit'?1:p==='walk'?.35:0;d.torso=p==='romantic'?.25:0;actors[active].rebuild();arrange();syncUI();}
const keys=['faceWidth','eyeSize','eyeGap','mouth','height','bulk','shoulder','leg','head','arm','knee','torso'];keys.forEach(k=>$(k).addEventListener('input',()=>{const v=Number($(k).value);actors[active].data[k]=v;$(k+'Out').textContent=v.toFixed(2);if(['arm','knee','torso'].includes(k))actors[active].applyPose();else rebuildActive();}));['hairStyle','outfitStyle','shoeStyle','accessory'].forEach(k=>$(k).addEventListener('change',e=>{actors[active].data[k]=e.target.value;rebuildActive();}));distance.addEventListener('input',()=>{$('distanceOut').textContent=distance.value;arrange();});
const sceneColors={studio:'#c9b2e7',room:'#d8b6d5',park:'#b9d9c2',sunset:'#f4b5c9',night:'#39355f',stage:'#c6a4ff'};$('scene').onchange=e=>{sceneType=e.target.value;scene.background.set(sceneColors[sceneType]);scene.fog.color.set(sceneColors[sceneType]);ground.material.color.set(sceneColors[sceneType]);};$('light').oninput=e=>{key.intensity=Number(e.target.value)*2;$('lightOut').textContent=e.target.value;};
function pack(){return {actors:actors.map(a=>({...a.data})),active,sceneType,distance:distance.value,interaction};}function loadData(s){actors.forEach(a=>scene.remove(a.root));actors=[];(s.actors||[initial]).slice(0,2).forEach(d=>actors.push(createActor(d.gender,d)));active=Math.min(s.active||0,actors.length-1);distance.value=s.distance||1.7;interaction=s.interaction||'none';duo=actors.length>1;$('scene').value=s.sceneType||'studio';$('scene').dispatchEvent(new Event('change'));arrange();syncUI();} $('saveBtn').onclick=()=>{try{localStorage.setItem('animeStudioSave',JSON.stringify(pack()));alert('บันทึกตัวละครในอุปกรณ์นี้แล้ว');}catch(e){alert('บันทึกไม่สำเร็จ: '+e.message);}};$('loadBtn').onclick=()=>{const s=localStorage.getItem('animeStudioSave');if(!s){alert('ยังไม่มีข้อมูลที่บันทึก');return;}try{loadData(JSON.parse(s));}catch(e){alert('ไฟล์บันทึกเสียหาย');}};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(pack(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='anime-character.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);};$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{loadData(JSON.parse(reader.result));}catch(err){alert('JSON ไม่ถูกต้อง');}};reader.readAsText(f);};
$('distanceOut').textContent=distance.value;syncUI();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();
</script></body></html>
